name: OMS QA CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oms_user
          POSTGRES_PASSWORD: oms_pass
          POSTGRES_DB: oms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply schema
        env:
          PGPASSWORD: oms_pass
        run: psql -h localhost -U oms_user -d oms_test -f sql/schema.sql

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://oms_user:oms_pass@localhost:5432/oms_test
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-fail-under=75

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true
